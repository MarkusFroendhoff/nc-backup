[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nc-backup"
version = "2.0.0"
description = "Nextcloud-Backup mit GUI, inkrementellen Snapshots und Cloud-Zielen für Ubuntu 24.04 und 26.04 LTS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "nc-backup" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = []

[project.scripts]
nc-backup = "nc_backup.cli:main"
nc-backup-gui = "nc_backup_gui.main:main"
nc-backup-web = "nc_backup_web.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nc_backup*", "nc_backup_gui*", "nc_backup_web*"]

[tool.setuptools.package-data]
nc_backup_web = ["static/*"]
