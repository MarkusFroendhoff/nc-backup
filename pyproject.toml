[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nc-backup"
version = "1.5.0"
description = "Nextcloud Backup mit GUI für Ubuntu ARM64 (Raspberry Pi)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=4.0",
    "Flask>=3.0",
    "PyGObject>=3.42",
]

[project.scripts]
nc-backup = "nc_backup.launcher:main"
nc-backup-web = "nc_backup.web.app:main"
nc-backup-run = "nc_backup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
